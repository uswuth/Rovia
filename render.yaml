# Render blueprint for the IntellMeet API.
# Web service (not static): Socket.io needs one long-lived connection.
#
# Free tier note: Render spins an idle web service down after 15 minutes and
# takes roughly 50 seconds to wake. The client pings /api/v1/health on a cron
# (see keep-wake Cron on Vercel) so a shared demo link opens without a wait.

services:
  - type: web
    name: intellmeet-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    # Render's own cold-start budget. Keep it above the pnpm-free npm install
    # time on a cold cache.
    autoDeploy: true
    envVars:
      # ── Required secrets. Set these in the Render dashboard, NOT here. ──────
      # MONGO_URI_FILE   -> /run/secrets/mongo_uri.txt (see secretFiles below)
      # JWT_ACCESS_SECRET, JWT_REFRESH_SECRET, ROOT_SHARED_SECRET
      # GROQ_API_KEY, OPENROUTER_API_KEY
      #
      # ── Non-secret settings ───────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        # Set this to your Vercel URL, comma-separated with localhost.
        sync: false
      - key: CORS_ORIGIN
        # Set this to your Vercel URL. No wildcard in production.
        sync: false
      - key: AWS_REGION
        value: auto
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ENDPOINT_URL
        sync: false
      - key: AWS_PUBLIC_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: OPENROUTER_SUMMARY_MODEL
        value: nvidia/nemotron-3-super-120b-a12b:free
      - key: FFMPEG_PATH
        value: ffmpeg

    # Secrets arrive as files, never as build args or image layers.
    secretFiles:
      - key: MONGO_URI
        # Generate locally: pnpm secrets:generate, then upload via Render's
        # "Secret Files" tab or `render secret-files put`.
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ROOT_SHARED_SECRET
        sync: false