# ==========================================
# IntellMeet — local infrastructure only
#
# This stack runs the THIRD-PARTY SERVICES a local machine needs: a MongoDB and
# an S3-compatible bucket store. It does not run the application.
#
# The client and the API run on the host with `pnpm dev`. That keeps the edit
# and reload loop fast, and it means a broken container is never mistaken for a
# broken application.
#
# Production does not use Docker at all:
#   client  -> Vercel   (builds the source, see vercel.json)
#   api     -> Render   (native Node runtime, see render.yaml)
# Docker exists here only to avoid needing a real database and a real S3
# account while developing.
#
#   docker compose up -d              # mongodb + s3 emulator
#   docker compose --profile tools up -d   # + mongodb web UI, s3 web UI
# ==========================================
services:
  mongodb:
    image: mongo:7
    container_name: intellmeet-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_LOCAL_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - intellmeet-network

  # S3-compatible object storage for recordings. Talks the same protocol as
  # Cloudflare R2, so switching to it in production is an endpoint change only.
  floci-aws:
    image: floci/localstack-aws
    container_name: intellmeet-s3
    restart: unless-stopped
    ports:
      - "${S3_PORT:-4566}:4566"
    volumes:
      - ./server/floci/cors.json:/config/cors.json:ro
    networks:
      - intellmeet-network

  # Creates the bucket and makes it world-readable, so presigned URLs the
  # browser calls actually work. Runs to completion once, then exits.
  floci-init:
    image: amazon/aws-cli
    container_name: intellmeet-s3-init
    depends_on:
      - floci-aws
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url=http://floci-aws:4566 s3api list-buckets >/dev/null 2>&1; do sleep 1; done;
      aws --endpoint-url=http://floci-aws:4566 s3api create-bucket --bucket ${AWS_S3_BUCKET:-intellmeet-bucket} >/dev/null 2>&1 || true;
      aws --endpoint-url=http://floci-aws:4566 s3api put-bucket-cors --bucket ${AWS_S3_BUCKET:-intellmeet-bucket} --cors-configuration file:///config/cors.json >/dev/null 2>&1 || true;
      echo 'bucket ready'
      "
    volumes:
      - ./server/floci/cors.json:/config/cors.json:ro
    networks:
      - intellmeet-network

  # Optional: web UIs for the services above.
  s3browser:
    image: tilt-dev/s3-test
    container_name: intellmeet-s3-ui
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "9000:10000"
    environment:
      - S3_ENDPOINT=http://floci-aws:4566
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - DEFAULT_REGION=${AWS_REGION:-us-east-1}
    networks:
      - intellmeet-network

  mongosh:
    image: mongodb/mongodb-community-server:latest
    container_name: intellmeet-mongosh
    profiles: ["tools"]
    entrypoint: ["/bin/sh", "-c"]
    # No mongodb-express: it cannot resolve mongodb+srv hostnames, and mounting
    # the Atlas data as a second database is a footgun. Use the Atlas UI instead.
    command: ["mongosh mongodb://mongodb:27017 --quiet --eval 'print(db.getCollectionNames())'"]
    depends_on:
      - mongodb
    networks:
      - intellmeet-network

networks:
  intellmeet-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local